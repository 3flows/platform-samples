name: Samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every morning, so a new `next` build of the platform that breaks a sample shows up within a day.
    - cron: '0 6 * * *'

jobs:
  samples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [appointment-reminders, starter]
    env:
      # @3flows/platform is published to GitHub Packages, which needs a token with read:packages.
      NPM_REPOSITORY_GH_TOKEN: ${{ secrets.NPM_REPOSITORY_GH_TOKEN || secrets.PLATFORM_REPO_TOKEN }}
    steps:
      - name: Skip without package access
        if: env.NPM_REPOSITORY_GH_TOKEN == ''
        run: echo "NPM_REPOSITORY_GH_TOKEN is not configured; skipping sample tests."

      - uses: actions/checkout@v4
        if: env.NPM_REPOSITORY_GH_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.NPM_REPOSITORY_GH_TOKEN != ''
        with:
          node-version: 24

      - name: Install
        if: env.NPM_REPOSITORY_GH_TOKEN != ''
        working-directory: ${{ matrix.project }}
        run: corepack enable && yarn install --immutable

      - name: Test against the locked platform version
        if: env.NPM_REPOSITORY_GH_TOKEN != ''
        working-directory: ${{ matrix.project }}
        run: yarn test

      - name: Test against the newest next build
        if: env.NPM_REPOSITORY_GH_TOKEN != '' && github.event_name == 'schedule'
        working-directory: ${{ matrix.project }}
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn up '@3flows/*@next' && yarn test
