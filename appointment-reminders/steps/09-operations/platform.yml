name: appointment-reminders

services:
  - name: AppointmentsService
  - name: NotificationsService

https:
  - name: api
    port: 3000
    services:
      - name: AppointmentsService
    # Built-in endpoints. Listing them replaces the defaults.
    wellknown:
      - type: ping
        url: ping
      - type: health
        url: healthz # what the Kubernetes probes expect
      - type: openapi.json
        url: openapi.json
      - type: metrics
        url: metrics
        disabled: true # scraped through a separate, internal port in production

docs:
  - name: DEFAULT
    type: memory

kvs:
  - name: DEFAULT
    type: memory

smss:
  - name: DEFAULT
    type: memory

mqs:
  - name: DEFAULT
    type: memory
    use:
      - NotificationsService

timers:
  - service: AppointmentsService
    name: reminders
    cron: '0 * * * * *' # every minute, so you can watch it locally
    runImmediatly: false
