name: appointments

services:
  - name: AppointmentsService

https:
  - name: api
    port: 3000
    services:
      - name: AppointmentsService

# NotificationsService is not running here anymore; calls go to the other process.
remotes:
  - name: NotificationsService
    url: http://127.0.0.1:3001/.jsonrpc

docs:
  - name: DEFAULT
    type: memory

kvs:
  - name: DEFAULT
    type: memory

timers:
  - service: AppointmentsService
    name: reminders
    cron: '0 * * * * *' # every minute, so you can watch it locally
    runImmediatly: false
