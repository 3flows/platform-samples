name: appointment-reminders

services:
  - name: AppointmentsService
  - name: NotificationsService

https:
  - name: api
    port: 3000
    services:
      - name: AppointmentsService

docs:
  - name: DEFAULT
    type: memory

kvs:
  - name: DEFAULT
    type: memory

smss:
  - name: DEFAULT
    type: memory

mqs:
  - name: DEFAULT
    type: memory
    use:
      - NotificationsService

timers:
  - service: AppointmentsService
    name: reminders
    cron: '0 * * * * *' # every minute, so you can watch it locally
    runImmediatly: false
