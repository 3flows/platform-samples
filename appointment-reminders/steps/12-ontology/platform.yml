name: appointment-reminders

services:
  - name: AppointmentsService
  - name: NotificationsService

https:
  - name: api
    port: 3000
    services:
      - name: AppointmentsService

docs:
  - name: DEFAULT
    type: memory

# Entities come from the domain and are stored in the DEFAULT docs store.
entities:
  backend: docs
  db: appointments
  domains:
    - Scheduling

kvs:
  - name: DEFAULT
    type: memory

smss:
  - name: DEFAULT
    type: memory

mqs:
  - name: DEFAULT
    type: memory
    use:
      - NotificationsService

timers:
  - service: AppointmentsService
    name: reminders
    cron: '0 * * * * *' # every minute, so you can watch it locally
    runImmediatly: false

# GraphQL on the same HTTP server: generated from the domain, plus the service handlers.
graphqls:
  - name: graphql
    useHttp: api
    path: /graphql
    domains:
      - Scheduling
    services:
      - name: AppointmentsService


# The domain, projected as an ontology: what the concepts mean, for people, catalogs and agents.
ontologies:
  - name: scheduling
    useHttp: api
    path: /ontology
    namespace: https://reminders.example.com/ontology/scheduling#
    domains:
      - Scheduling
