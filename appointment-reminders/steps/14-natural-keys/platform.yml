name: appointment-reminders

services:
  - name: AppointmentsService
  - name: NotificationsService

https:
  - name: api
    port: 3000
    services:
      - name: AppointmentsService

docs:
  - name: DEFAULT
    type: memory

# Entities come from the ontology and are stored in the DEFAULT docs store.
entities:
  backend: docs
  db: appointments
  ontologies:
    - AppointmentsOntology

kvs:
  - name: DEFAULT
    type: memory

smss:
  - name: DEFAULT
    type: memory

mqs:
  - name: DEFAULT
    type: memory
    use:
      - NotificationsService

timers:
  - service: AppointmentsService
    name: reminders
    cron: '0 * * * * *' # every minute, so you can watch it locally
    runImmediatly: false

# GraphQL on the same HTTP server: generated from the ontology, plus the service handlers.
graphqls:
  - name: graphql
    useHttp: api
    path: /graphql
    ontologies:
      - AppointmentsOntology
    services:
      - name: AppointmentsService

# Read-only control-plane API. Disabled unless explicitly enabled.
# In production, protect it with `auth` or expose it on an internal HTTP server only.
admins:
  - name: admin
    useHttp: api
    path: /admin
    enabled: true
    readonly: true
